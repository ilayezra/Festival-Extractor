# Builds Festival Extractor for Windows, macOS and Linux.
# - On pull requests / manual runs: the builds are attached to the run as artifacts.
# - Manual run with a release version (e.g. 1.3.0): after every build passes its self-test,
#   a draft release with all builds is created. Publishing it creates the tag.
name: Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g. 1.3.0) - leave empty for a test build'
        required: false
        default: ''
      release_title:
        description: 'Release title'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (Markdown, can also be edited on the draft)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FestivalExtractor-Windows-x64.zip
          - os: macos-latest
            asset: FestivalExtractor-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: FestivalExtractor-macOS-Intel.zip
          - os: ubuntu-22.04
            asset: FestivalExtractor-Linux-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm FFR.spec

      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Festival Extractor.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path "dist/Festival Extractor.exe" -DestinationPath "${{ matrix.asset }}"

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Festival Extractor.app/Contents/MacOS/Festival Extractor" --self-test
          ditto -c -k --keepParent "dist/Festival Extractor.app" "${{ matrix.asset }}"

      - name: Self-test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "dist/Festival Extractor" --self-test
          cd dist && zip -9 "../${{ matrix.asset }}" "Festival Extractor"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Runs only when every build and self-test passed
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${TITLE:-$TAG}" \
            --notes-file notes.md \
            --draft
