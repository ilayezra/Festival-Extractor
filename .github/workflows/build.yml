# Builds Festival Extractor for Windows, macOS and Linux.
# - On pull requests / manual runs: the builds are attached to the run as artifacts.
# - On a pushed tag (e.g. 2.0.0): a draft release with all builds is created.
name: Build

on:
  push:
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FestivalExtractor-Windows-x64.zip
          - os: macos-latest
            asset: FestivalExtractor-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: FestivalExtractor-macOS-Intel.zip
          - os: ubuntu-22.04
            asset: FestivalExtractor-Linux-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm FFR.spec

      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Festival Extractor.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive -Path "dist/Festival Extractor.exe" -DestinationPath "${{ matrix.asset }}"

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Festival Extractor.app/Contents/MacOS/Festival Extractor" --self-test
          ditto -c -k --keepParent "dist/Festival Extractor.app" "${{ matrix.asset }}"

      - name: Self-test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "dist/Festival Extractor" --self-test
          cd dist && zip -9 "../${{ matrix.asset }}" "Festival Extractor"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Runs only when every build and self-test passed. The release title and notes
  # come from the annotated tag: first line = title, the rest = notes.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents:subject)' "${{ github.ref_name }}" > title.txt
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > notes.md

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "$(cat title.txt)" \
            --notes-file notes.md \
            --draft
